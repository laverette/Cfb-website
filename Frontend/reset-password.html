<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - CFB Predictions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/site-theme.css">
  <link rel="stylesheet" href="Resources/Styles/weeklypicks.css">
</head>
<body>
  <nav class="navbar weeklypicks-navbar site-nav">
    <div class="container-fluid">
      <div class="navbar-content-weekly site-nav-inner">
        <button class="hamburger-menu-btn" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="dropdownMenu">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
        <h1 class="site-title">My College Football Site</h1>
        <div id="auth-nav" class="navbar-auth-cluster"></div>
      </div>
    </div>
  </nav>
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <div class="container mt-4 page-shell">
    <h1 class="page-title">Choose a new password</h1>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="section-card" style="margin: 2rem 0;">
          <form id="resetForm">
            <div class="mb-3">
              <label for="newPassword">New password:</label>
              <input type="password" id="newPassword" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
            <div class="mb-3">
              <label for="confirmPassword">Confirm password:</label>
              <input type="password" id="confirmPassword" class="form-control" minlength="8" required autocomplete="new-password">
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-gold" style="padding: 10px 30px;">Update password</button>
            </div>
          </form>
          <p id="resetMessage" style="text-align:center;margin-top:1rem;min-height:1.4em;"></p>
          <div style="text-align:center;margin-top:1rem;">
            <a href="login.html" style="color:#FFD700;font-weight:bold;text-decoration:none;">Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/auth-ui.js"></script>
  <script>
    function closeMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      menu.classList.remove('show');
      button.classList.remove('active');
      button.setAttribute('aria-expanded', 'false');
      overlay.classList.remove('show');
      document.body.classList.remove('menu-open');
    }
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      const isOpening = !menu.classList.contains('show');
      menu.classList.toggle('show', isOpening);
      button.classList.toggle('active', isOpening);
      button.setAttribute('aria-expanded', isOpening ? 'true' : 'false');
      overlay.classList.toggle('show', isOpening);
      document.body.classList.toggle('menu-open', isOpening);
    }

    const token = new URLSearchParams(window.location.search).get('token') || '';
    const msg = document.getElementById('resetMessage');

    if (!token) {
      msg.style.color = '#f44336';
      msg.textContent = 'Missing reset token. Request a new link from the login page.';
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password.length < 8) {
        msg.style.color = '#f44336';
        msg.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (password !== confirm) {
        msg.style.color = '#f44336';
        msg.textContent = 'Passwords do not match.';
        return;
      }
      msg.style.color = '#d4b896';
      msg.textContent = 'Updating…';
      try {
        const resp = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', accept: 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          msg.style.color = '#f44336';
          msg.textContent = data.message || data.error || 'Could not reset password.';
          return;
        }
        if (data.token) localStorage.setItem('authToken', data.token);
        if (data.user) localStorage.setItem('currentUser', JSON.stringify(data.user));
        if (window.AuthUI) AuthUI.refreshFromStorage();
        msg.style.color = '#4CAF50';
        msg.textContent = 'Password updated. Redirecting…';
        setTimeout(function () {
          window.location.href = 'weeklypicks.html';
        }, 1000);
      } catch (err) {
        msg.style.color = '#f44336';
        msg.textContent = 'Network error. Try again.';
      }
    });
  </script>
</body>
</html>
