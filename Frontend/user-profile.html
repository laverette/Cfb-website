<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/site-theme.css">
  <link rel="stylesheet" href="Resources/Styles/leaderboard.css">
</head>
<body>
  <nav class="navbar weeklypicks-navbar site-nav">
    <div class="container-fluid">
      <div class="navbar-content-weekly site-nav-inner">
        <button class="hamburger-menu-btn" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="dropdownMenu">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
        <h1 class="site-title">Player Profile</h1>
        <div id="auth-nav" class="navbar-auth-cluster"></div>
      </div>
    </div>
  </nav>
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <main class="container page-shell lb-page">
    <div id="profileRoot">
      <p class="lb-loading">Loading profile…</p>
    </div>
    <div class="lb-footer-links">
      <a href="prediction-history.html" class="btn btn-brown">← Leaderboards</a>
      <a href="weeklypicks.html" class="btn btn-brown">Weekly Picks</a>
    </div>
  </main>

  <script src="scripts/auth-ui.js"></script>
  <script>
    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function record(bucket) {
      return `${bucket?.correctPicks || 0}-${bucket?.incorrectPicks || 0}-${bucket?.tiedPicks || 0}`;
    }

    function pct(bucket) {
      return `${Number(bucket?.accuracy || 0).toFixed(1)}%`;
    }

    function pickResultClass(pick) {
      if (pick.isTie) return 'is-tie';
      if (pick.isCorrect === true) return 'is-correct';
      if (pick.isCorrect === false) return 'is-wrong';
      return 'is-pending';
    }

    function pickResultLabel(pick) {
      if (pick.isTie) return 'Tie';
      if (pick.isCorrect === true) return 'Correct';
      if (pick.isCorrect === false) return 'Wrong';
      return 'Pending';
    }

    /** Favorite = side implied by betting_line (neg = home favorite). */
    function favoriteEspnIdFromPick(p) {
      const line = Number(p?.bettingLine);
      if (!Number.isFinite(line) || line === 0) return null;
      const home = Number(p?.homeTeamEspnId);
      const away = Number(p?.awayTeamEspnId);
      if (!Number.isFinite(home) || !Number.isFinite(away)) return null;
      return line < 0 ? home : away;
    }

    function buildSeasonStory(displayName, stats, weeks) {
      const name = String(displayName || 'This picker').trim() || 'This picker';
      const season = stats?.thisSeason || {};
      const allTime = stats?.allTime || {};
      const seasonYear = season.seasonYear || new Date().getFullYear();
      const graded = Number(season.correctPicks || 0) + Number(season.incorrectPicks || 0) + Number(season.tiedPicks || 0);
      const pending = Number(season.pendingPicks || 0);
      const paragraphs = [];

      if (graded === 0 && pending === 0) {
        return [
          `${escapeHtml(name)} is still waiting for the first pick of ${seasonYear}. The story starts when the slate locks.`,
        ];
      }

      const w = Number(season.correctPicks || 0);
      const l = Number(season.incorrectPicks || 0);
      const t = Number(season.tiedPicks || 0);
      const acc = Number(season.accuracy || 0);
      let opener = `${escapeHtml(name)} is ${w}-${l}${t ? `-${t}` : ''} in ${seasonYear}`;
      if (graded > 0) {
        if (acc >= 70) opener += ` — cooking at ${acc.toFixed(1)}% accuracy.`;
        else if (acc >= 55) opener += `, sitting pretty at ${acc.toFixed(1)}%.`;
        else if (acc >= 45) opener += `, grinding through a ${acc.toFixed(1)}% season.`;
        else opener += ` — the board has been rough (${acc.toFixed(1)}%).`;
      } else {
        opener += ' with graded results still loading in.';
      }
      paragraphs.push(opener);

      const seasonWeeks = (Array.isArray(weeks) ? weeks : []).filter(
        (wk) => Number(wk.seasonYear) === Number(seasonYear)
      );
      const scoredWeeks = seasonWeeks.filter(
        (wk) => Number(wk.correctPicks || 0) + Number(wk.incorrectPicks || 0) + Number(wk.tiedPicks || 0) > 0
      );
      if (scoredWeeks.length) {
        const scoreOf = (wk) =>
          Number(wk.correctPicks || 0) - Number(wk.incorrectPicks || 0) + Number(wk.accuracy || 0) / 1000;
        const best = [...scoredWeeks].sort((a, b) => scoreOf(b) - scoreOf(a))[0];
        const worst = [...scoredWeeks].sort((a, b) => scoreOf(a) - scoreOf(b))[0];
        paragraphs.push(
          `Best chapter: Week ${escapeHtml(best.weekNumber)} (${record(best)}, ${pct(best)}). ` +
            (best.weekId !== worst.weekId
              ? `Rough patch: Week ${escapeHtml(worst.weekNumber)} went ${record(worst)}.`
              : 'Only one graded week so far — plot twist pending.')
        );
      }

      const streak = Number(allTime.currentStreak || 0);
      const bestStreak = Number(allTime.bestStreak || 0);
      if (streak >= 3) {
        paragraphs.push(`On a ${streak}-pick heater right now (best ever: ${bestStreak}). Do not fade the hot hand.`);
      } else if (streak <= -3) {
        paragraphs.push(`Ice cold at ${Math.abs(streak)} wrong in a row — the thaw has to start somewhere (career best streak: ${bestStreak}).`);
      } else if (bestStreak >= 5) {
        paragraphs.push(`Career heater peaked at ${bestStreak} correct in a row. The legend lives.`);
      }

      const teamCounts = new Map();
      let chalk = 0;
      let dog = 0;
      for (const wk of seasonWeeks) {
        for (const p of wk.picks || []) {
          const team = String(p.pickedTeamName || '').trim();
          if (team) teamCounts.set(team, (teamCounts.get(team) || 0) + 1);
          const fav = favoriteEspnIdFromPick(p);
          const picked = Number(p.pickedTeamEspnId);
          if (fav != null && Number.isFinite(picked)) {
            if (picked === fav) chalk += 1;
            else dog += 1;
          }
        }
      }
      const topTeams = [...teamCounts.entries()]
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .slice(0, 3);
      if (topTeams.length) {
        const list = topTeams
          .map(([t, n]) => `${escapeHtml(t)} (${n})`)
          .join(', ');
        paragraphs.push(`Most trusted jerseys this season: ${list}.`);
      }
      const linePicks = chalk + dog;
      if (linePicks >= 5) {
        const chalkPct = Math.round((chalk / linePicks) * 100);
        if (chalkPct >= 65) {
          paragraphs.push(`Lean check: ${chalkPct}% chalk — respect the favorites.`);
        } else if (chalkPct <= 40) {
          paragraphs.push(`Lean check: fading the lines hard (${100 - chalkPct}% underdogs). Upset energy.`);
        } else {
          paragraphs.push(`Lean check: balanced board (${chalkPct}% favorites / ${100 - chalkPct}% dogs).`);
        }
      }

      if (pending > 0) {
        paragraphs.push(`${pending} pick${pending === 1 ? '' : 's'} still pending — the season story is not done writing itself.`);
      }

      return paragraphs;
    }

    async function loadProfile() {
      const root = document.getElementById('profileRoot');
      const params = new URLSearchParams(window.location.search);
      const username = params.get('username');
      const id = params.get('id');
      const qs = username
        ? `username=${encodeURIComponent(username)}`
        : id
          ? `id=${encodeURIComponent(id)}`
          : '';

      if (!qs) {
        const me = window.AuthUI && AuthUI.getCurrentUser && AuthUI.getCurrentUser();
        if (me && me.username) {
          window.location.replace(`user-profile.html?username=${encodeURIComponent(me.username)}`);
          return;
        }
        root.innerHTML = `
          <div class="section-card" style="text-align:center;">
            <h2 class="gold-heading">No player selected</h2>
            <p>Open a profile from the <a href="prediction-history.html">leaderboards</a>, or log in to view yours.</p>
          </div>`;
        return;
      }

      try {
        const resp = await fetch(`/api/users/public?${qs}`, { headers: { accept: 'application/json' } });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || `Failed (${resp.status})`);

        const user = data.user || {};
        const stats = data.stats || {};
        const weeks = Array.isArray(data.weeks) ? data.weeks : [];
        const bama = data.bamaSchedule || null;
        const slates = Array.isArray(bama && bama.slates) && bama.slates.length
          ? bama.slates
          : bama && bama.stats && bama.stats.totalPicks > 0
            ? [bama]
            : [];
        const cfp = data.cfpBracket && data.cfpBracket.bracket ? data.cfpBracket : null;
        const streak = Number(stats.allTime?.currentStreak || 0);
        const streakEmoji = streak >= 5 ? '🔥🔥🔥' : streak >= 3 ? '🔥' : streak >= 1 ? '🌡️' : streak <= -5 ? '🧊' : streak <= -3 ? '❄️' : streak <= -1 ? '💨' : '😐';
        const streakLabel = streak === 0 ? 'Even' : `${Math.abs(streak)} ${streak > 0 ? 'hot' : 'cold'}`;
        document.title = `${user.displayName || user.username || 'Player'} · Profile`;

        const me = window.AuthUI && AuthUI.getCurrentUser && AuthUI.getCurrentUser();
        const isOwnProfile =
          !!(me && (
            (user.username && me.username && String(user.username).toLowerCase() === String(me.username).toLowerCase()) ||
            (user.id != null && me.id != null && String(user.id) === String(me.id))
          ));

        root.innerHTML = `
          <header class="section-card lb-profile-hero">
            <div class="lb-profile-hero-top">
              <button type="button" class="profile-avatar-zoom-btn" id="profileAvatarZoomBtn" aria-label="Enlarge profile picture">
                ${window.AuthUI && AuthUI.avatarImgHtml
                  ? AuthUI.avatarImgHtml(user, "lb-profile-avatar user-avatar", 72)
                  : ""}
              </button>
              <div>
                <p class="lb-eyebrow">Player profile</p>
                <h1 class="page-title" style="margin-bottom:0.2rem;">${escapeHtml(user.displayName || user.username)}</h1>
                <p class="lb-subtitle">@${escapeHtml(user.username)}${user.memberSince ? ` · joined ${escapeHtml(new Date(user.memberSince).toLocaleDateString())}` : ''}</p>
              </div>
            </div>
            <p class="lb-my-streak">${streakEmoji} Current streak: <strong>${escapeHtml(streakLabel)}</strong> · Best 🔥 ${stats.allTime?.bestStreak || 0}</p>
            ${user.bio ? `<p class="lb-bio">${escapeHtml(user.bio)}</p>` : ''}
          </header>

          ${isOwnProfile ? `
          <section class="section-card" id="avatarSettingsSection">
            <details class="lb-collapse">
              <summary class="lb-collapse-summary">
                <span class="lb-collapse-title">Your avatar</span>
                <span class="lb-collapse-meta">Tap to change</span>
                <span class="lb-collapse-chevron" aria-hidden="true">▼</span>
              </summary>
              <div class="lb-collapse-body">
                <p style="text-align:center;color:#d4b896;margin:0 0 1rem;font-size:0.92rem;">
                  Upload your own photo or pick a preset — changes show in the nav and on your profile.
                </p>
                <div class="avatar-upload-block">
                  <label class="avatar-picker-label" for="avatarUploadInput">Upload image</label>
                  <p class="avatar-picker-hint">JPEG, PNG, or WebP · max 1 MB · square crops work best</p>
                  <div class="avatar-upload-row">
                    <input type="file" id="avatarUploadInput" accept="image/jpeg,image/png,image/webp" hidden>
                    <button type="button" class="btn btn-gold avatar-upload-btn" id="avatarUploadBtn">Choose photo</button>
                    <span class="avatar-upload-filename" id="avatarUploadFilename"></span>
                  </div>
                </div>
                <p class="avatar-upload-divider"><span>or choose a preset</span></p>
                <div class="avatar-picker-block" id="profileAvatarPickerHost"></div>
                <p id="avatarSettingsStatus" style="text-align:center;margin:0.75rem 0 0;font-size:0.85rem;color:#bfa88a;min-height:1.2em;"></p>
              </div>
            </details>
          </section>

          <section class="section-card" id="accountSettingsSection">
            <h2 class="gold-heading" style="text-align:center;margin-bottom:0.75rem;">Account</h2>
            <p style="text-align:center;color:#d4b896;margin:0 0 1.25rem;font-size:0.92rem;">
              Change your username or password. Username links on leaderboards use @username.
            </p>

            <form id="usernameForm" style="max-width:420px;margin:0 auto 1.5rem;">
              <label for="newUsername" style="display:block;margin-bottom:0.35rem;font-weight:700;">Username</label>
              <input type="text" id="newUsername" class="form-control" value="${escapeHtml(user.username || '')}" minlength="3" maxlength="50" pattern="[A-Za-z0-9_]+" required autocomplete="username">
              <p style="margin:0.35rem 0 0.75rem;font-size:0.8rem;color:#bfa88a;">Letters, numbers, and underscores only (3–50).</p>
              <button type="submit" class="btn btn-gold" style="width:100%;">Save username</button>
              <p id="usernameSettingsStatus" style="text-align:center;margin:0.65rem 0 0;font-size:0.85rem;color:#bfa88a;min-height:1.2em;"></p>
            </form>

            <hr style="border:0;border-top:1px solid rgba(141,110,99,0.45);margin:1.25rem 0;">

            <form id="passwordForm" style="max-width:420px;margin:0 auto;">
              <label for="currentPassword" style="display:block;margin-bottom:0.35rem;font-weight:700;">Current password</label>
              <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password" style="margin-bottom:0.75rem;">
              <label for="newAccountPassword" style="display:block;margin-bottom:0.35rem;font-weight:700;">New password</label>
              <input type="password" id="newAccountPassword" class="form-control" minlength="8" required autocomplete="new-password" style="margin-bottom:0.75rem;">
              <label for="confirmAccountPassword" style="display:block;margin-bottom:0.35rem;font-weight:700;">Confirm new password</label>
              <input type="password" id="confirmAccountPassword" class="form-control" minlength="8" required autocomplete="new-password" style="margin-bottom:0.85rem;">
              <button type="submit" class="btn btn-gold" style="width:100%;">Update password</button>
              <p id="passwordSettingsStatus" style="text-align:center;margin:0.65rem 0 0;font-size:0.85rem;color:#bfa88a;min-height:1.2em;"></p>
            </form>
          </section>

          <section class="section-card" id="reminderSettingsSection">
            <h2 class="gold-heading" style="text-align:center;margin-bottom:0.75rem;">Email reminders</h2>
            <p style="text-align:center;color:#d4b896;margin:0 0 1rem;font-size:0.92rem;">
              Get a reminder about 2 hours before weekly picks lock (30 min after Saturday’s first kickoff) if you haven't submitted yet.
            </p>
            <label style="display:flex;align-items:center;justify-content:center;gap:0.65rem;cursor:pointer;">
              <input type="checkbox" id="emailRemindersToggle">
              <span>Email me pick reminders</span>
            </label>
            <p id="reminderSettingsStatus" style="text-align:center;margin:0.75rem 0 0;font-size:0.85rem;color:#bfa88a;min-height:1.2em;"></p>
          </section>
          ` : ''}

          <section class="section-card">
            <h2 class="gold-heading" style="text-align:center;">Stats</h2>
            <div class="lb-stat-grid">
              <div class="lb-stat">
                <span class="lb-stat-label">All time</span>
                <strong>${record(stats.allTime)}</strong>
                <span>${pct(stats.allTime)}</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">This season</span>
                <strong>${record(stats.thisSeason)}</strong>
                <span>${pct(stats.thisSeason)}</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">Best streak</span>
                <strong>🔥 ${stats.allTime?.bestStreak || 0}</strong>
                <span>${stats.allTime?.pendingPicks || 0} pending</span>
              </div>
            </div>
            ${(stats.bySeason || []).length ? `
              <div class="lb-season-list">
                <h3 class="lb-section-title">By season</h3>
                <ul>
                  ${(stats.bySeason || []).map((s) => `
                    <li><span>${s.seasonYear}</span><strong>${record(s)}</strong><span>${pct(s)}</span></li>
                  `).join('')}
                </ul>
              </div>
            ` : ''}
          </section>

          <section class="section-card season-story">
            <h2 class="gold-heading" style="text-align:center;">Season story</h2>
            <div class="season-story-body">
              ${buildSeasonStory(user.displayName || user.username, stats, weeks)
                .map((p) => `<p class="season-story-p">${p}</p>`)
                .join('')}
            </div>
          </section>

          ${slates.map((slate) => {
            const bamaStats = slate.stats || {};
            const bamaPreds = Array.isArray(slate.predictions) ? slate.predictions : [];
            if (!bamaStats.totalPicks) return '';
            const teamLabel = slate.team || 'Team';
            return `
          <section class="section-card">
            <h2 class="gold-heading" style="text-align:center;">📅 ${escapeHtml(teamLabel)} Schedule (${escapeHtml(String(slate.season || bama.season || ''))})</h2>
            <div class="lb-stat-grid">
              <div class="lb-stat">
                <span class="lb-stat-label">Record</span>
                <strong>${bamaStats.correctPicks}-${bamaStats.incorrectPicks}</strong>
                <span>${bamaStats.gradedPicks ? bamaStats.accuracy + '% accuracy' : 'No graded games yet'}</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">Games picked</span>
                <strong>${bamaStats.predictedGames}</strong>
                <span>${bamaStats.pendingPicks} pending</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">Score accuracy</span>
                <strong>${bamaStats.avgScoreError != null ? bamaStats.avgScoreError + ' avg off' : '—'}</strong>
                <span><a href="bama.html?team=${encodeURIComponent(teamLabel)}#leaderboard">View leaderboard</a></span>
              </div>
            </div>
            <div class="lb-pick-grid" style="margin-top:1rem;">
              ${bamaPreds.map((p) => {
                const g = p.game || {};
                const graded = p.grades && p.grades.isWinnerCorrect != null;
                const cls = !graded ? '' : p.grades.isWinnerCorrect ? 'lb-pick-win' : 'lb-pick-loss';
                const result = !graded ? 'Pending' : p.grades.isWinnerCorrect ? '✓' : '✗';
                const teamScore = g.teamScore != null ? g.teamScore : g.alabamaScore;
                const actual = g.completed && teamScore != null ? ` · Final ${teamScore}-${g.opponentScore}` : '';
                const win = p.predictedTeamWin != null ? p.predictedTeamWin : p.predictedAlabamaWin;
                const pScore = p.predictedTeamScore != null ? p.predictedTeamScore : p.predictedAlabamaScore;
                return `
                  <div class="lb-pick-chip ${cls}">
                    <span class="lb-pick-game">Week ${escapeHtml(p.week)} vs ${escapeHtml(p.opponent || g.opponent || '—')}</span>
                    <strong>${win ? escapeHtml(teamLabel) + ' W' : escapeHtml(teamLabel) + ' L'} ${pScore}-${p.predictedOpponentScore}</strong>
                    <span class="lb-pick-result">${result}${actual}</span>
                  </div>`;
              }).join('')}
            </div>
          </section>`;
          }).join('')}

          ${cfp && cfp.bracket ? `
          <section class="section-card">
            <h2 class="gold-heading" style="text-align:center;">🏆 CFP Bracket (${escapeHtml(String(cfp.season || ''))})</h2>
            <div class="lb-stat-grid">
              <div class="lb-stat">
                <span class="lb-stat-label">Champion pick</span>
                <strong>${escapeHtml(cfp.bracket.championName || '—')}</strong>
                <span>${cfp.bracket.isComplete ? 'Complete bracket' : 'In progress'}</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">Correct picks</span>
                <strong>${cfp.bracket.gradedPicks ? `${cfp.bracket.correctPicks}/${cfp.bracket.gradedPicks}` : '—'}</strong>
                <span>${cfp.bracket.accuracy != null ? cfp.bracket.accuracy + '% accuracy' : 'Awaiting results'}</span>
              </div>
              <div class="lb-stat">
                <span class="lb-stat-label">Actions</span>
                <strong><a href="CFPPredictions.html?username=${encodeURIComponent(user.username || '')}">View bracket</a></strong>
                <span><a href="CFPPredictions.html#leaderboard">Browse brackets</a></span>
              </div>
            </div>
          </section>` : ''}

          <section class="section-card">
            <h2 class="gold-heading" style="text-align:center;">Pick history</h2>
            ${weeks.length === 0
              ? '<p class="lb-empty">No picks submitted yet.</p>'
              : weeks.map((w) => `
                <details class="lb-week-card lb-collapse">
                  <summary class="lb-week-head lb-collapse-summary">
                    <h3>Week ${escapeHtml(w.weekNumber)} · ${escapeHtml(w.seasonYear)}</h3>
                    <span class="lb-collapse-meta">${record(w)} · ${pct(w)}</span>
                    <span class="lb-collapse-chevron" aria-hidden="true">▼</span>
                  </summary>
                  <div class="lb-collapse-body">
                    <div class="lb-pick-grid">
                      ${(w.picks || []).map((p) => `
                        <div class="lb-pick-chip ${pickResultClass(p)}">
                          <span class="lb-pick-game">Game ${escapeHtml(p.gameNumber)}</span>
                          <strong>${escapeHtml(p.pickedTeamName || '—')}</strong>
                          <span class="lb-pick-result">${pickResultLabel(p)}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </details>
              `).join('')}
          </section>
        `;

        if (isOwnProfile) {
          wireAvatarSettings(user);
          wireAccountSettings(user);
          wireReminderSettings();
        }
        wireProfileAvatarLightbox(user);
      } catch (err) {
        root.innerHTML = `
          <div class="section-card" style="text-align:center;">
            <h2 class="gold-heading">Could not load profile</h2>
            <p>${escapeHtml(err.message || 'Unknown error')}</p>
          </div>`;
      }
    }

    function authHeaders() {
      const token = window.AuthUI && AuthUI.getAuthToken && AuthUI.getAuthToken();
      return token ? { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } : {};
    }

    function syncLocalUserAvatar(userPayload) {
      try {
        const prev = (window.AuthUI && AuthUI.getCurrentUser && AuthUI.getCurrentUser()) || {};
        const next = Object.assign({}, prev, userPayload || {});
        if (userPayload && userPayload.avatarUrl != null) next.avatarUrl = userPayload.avatarUrl;
        localStorage.setItem('currentUser', JSON.stringify(next));
        if (window.AuthUI && AuthUI.refreshFromStorage) AuthUI.refreshFromStorage();
      } catch (e) {}
    }

    function syncLocalSession(userPayload, token) {
      try {
        const prev = (window.AuthUI && AuthUI.getCurrentUser && AuthUI.getCurrentUser()) || {};
        const next = Object.assign({}, prev, userPayload || {});
        localStorage.setItem('currentUser', JSON.stringify(next));
        if (token) localStorage.setItem('authToken', token);
        if (window.AuthUI && AuthUI.refreshFromStorage) AuthUI.refreshFromStorage();
      } catch (e) {}
    }

    function wireAccountSettings(user) {
      const usernameForm = document.getElementById('usernameForm');
      const passwordForm = document.getElementById('passwordForm');
      const token = window.AuthUI && AuthUI.getAuthToken && AuthUI.getAuthToken();
      if (!token) return;

      if (usernameForm) {
        usernameForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          const status = document.getElementById('usernameSettingsStatus');
          const username = String(document.getElementById('newUsername').value || '').trim();
          if (!/^[A-Za-z0-9_]{3,50}$/.test(username)) {
            if (status) status.textContent = 'Username must be 3–50 letters, numbers, or underscores.';
            return;
          }
          if (status) status.textContent = 'Saving…';
          try {
            const resp = await fetch('/api/auth/profile', {
              method: 'PATCH',
              headers: { ...authHeaders(), accept: 'application/json' },
              body: JSON.stringify({ username }),
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.message || data.error || `Failed (${resp.status})`);
            syncLocalSession(data.user, data.token);
            if (status) status.textContent = 'Username updated.';
            if (data.user && data.user.username) {
              window.history.replaceState(
                {},
                '',
                `user-profile.html?username=${encodeURIComponent(data.user.username)}`
              );
              const subtitle = document.querySelector('.lb-subtitle');
              if (subtitle) {
                const joined = user.memberSince
                  ? ` · joined ${new Date(user.memberSince).toLocaleDateString()}`
                  : '';
                subtitle.textContent = `@${data.user.username}${joined}`;
              }
              const title = document.querySelector('.lb-profile-hero .page-title');
              if (title && data.user.displayName) title.textContent = data.user.displayName;
            }
          } catch (err) {
            if (status) status.textContent = err.message || 'Could not update username.';
          }
        });
      }

      if (passwordForm) {
        passwordForm.addEventListener('submit', async function (e) {
          e.preventDefault();
          const status = document.getElementById('passwordSettingsStatus');
          const currentPassword = document.getElementById('currentPassword').value;
          const newPassword = document.getElementById('newAccountPassword').value;
          const confirm = document.getElementById('confirmAccountPassword').value;
          if (newPassword.length < 8) {
            if (status) status.textContent = 'New password must be at least 8 characters.';
            return;
          }
          if (newPassword !== confirm) {
            if (status) status.textContent = 'New passwords do not match.';
            return;
          }
          if (status) status.textContent = 'Updating…';
          try {
            const resp = await fetch('/api/auth/profile', {
              method: 'PATCH',
              headers: { ...authHeaders(), accept: 'application/json' },
              body: JSON.stringify({ currentPassword, newPassword }),
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.message || data.error || `Failed (${resp.status})`);
            passwordForm.reset();
            if (status) status.textContent = 'Password updated.';
          } catch (err) {
            if (status) status.textContent = err.message || 'Could not update password.';
          }
        });
      }
    }

    function applyAvatarToHero(userPayload) {
      const btn = document.getElementById('profileAvatarZoomBtn');
      const hero = document.querySelector('.lb-profile-hero-top');
      if (!userPayload || !window.AuthUI) return;
      const html = AuthUI.avatarImgHtml(userPayload, 'lb-profile-avatar user-avatar', 72);
      if (btn) {
        btn.innerHTML = html;
        btn.dataset.avatarSrc = (AuthUI.avatarSrcForUser && AuthUI.avatarSrcForUser(userPayload)) || '';
        return;
      }
      if (!hero) return;
      const slot = hero.querySelector('.lb-profile-avatar, .user-avatar, .user-avatar--initial');
      if (slot) {
        slot.outerHTML = html;
      } else {
        const wrap = document.createElement('div');
        wrap.innerHTML = html;
        if (wrap.firstChild) hero.insertBefore(wrap.firstChild, hero.firstChild);
      }
    }

    function ensureAvatarLightbox() {
      let overlay = document.getElementById('profileAvatarLightbox');
      if (overlay) return overlay;
      overlay = document.createElement('div');
      overlay.id = 'profileAvatarLightbox';
      overlay.className = 'profile-avatar-lightbox';
      overlay.hidden = true;
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', 'Enlarged profile picture');
      overlay.innerHTML = `
        <button type="button" class="profile-avatar-lightbox-backdrop" aria-label="Close"></button>
        <div class="profile-avatar-lightbox-panel">
          <img class="profile-avatar-lightbox-img" alt="" decoding="async">
          <div class="profile-avatar-lightbox-initial" hidden aria-hidden="true"></div>
          <button type="button" class="profile-avatar-lightbox-close" aria-label="Close">×</button>
        </div>
      `;
      document.body.appendChild(overlay);

      const close = () => {
        overlay.hidden = true;
        document.body.classList.remove('avatar-lightbox-open');
      };
      overlay.querySelector('.profile-avatar-lightbox-backdrop').addEventListener('click', close);
      overlay.querySelector('.profile-avatar-lightbox-close').addEventListener('click', close);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !overlay.hidden) close();
      });
      return overlay;
    }

    function openProfileAvatarLightbox() {
      const btn = document.getElementById('profileAvatarZoomBtn');
      const overlay = ensureAvatarLightbox();
      const img = overlay.querySelector('.profile-avatar-lightbox-img');
      const initialEl = overlay.querySelector('.profile-avatar-lightbox-initial');
      const src = (btn && btn.dataset.avatarSrc) || '';
      if (src) {
        img.hidden = false;
        img.src = src;
        initialEl.hidden = true;
        initialEl.textContent = '';
      } else {
        const initial = (btn && btn.dataset.avatarInitial) || '?';
        img.hidden = true;
        img.removeAttribute('src');
        initialEl.hidden = false;
        initialEl.textContent = initial;
      }
      overlay.hidden = false;
      document.body.classList.add('avatar-lightbox-open');
    }

    function wireProfileAvatarLightbox(user) {
      const btn = document.getElementById('profileAvatarZoomBtn');
      if (!btn) return;
      const src =
        (window.AuthUI && AuthUI.avatarSrcForUser && AuthUI.avatarSrcForUser(user)) || '';
      const name = String(user?.displayName || user?.username || '?');
      btn.dataset.avatarSrc = src;
      btn.dataset.avatarInitial = name.trim().charAt(0).toUpperCase() || '?';
      if (btn.dataset.lightboxWired === '1') return;
      btn.dataset.lightboxWired = '1';
      btn.addEventListener('click', openProfileAvatarLightbox);
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(new Error('Could not read that file'));
        reader.readAsDataURL(file);
      });
    }

    /** Downscale large photos client-side before upload (max edge 512px, JPEG). */
    function resizeImageForAvatar(file) {
      return new Promise(async (resolve, reject) => {
        try {
          const dataUrl = await readFileAsDataUrl(file);
          const img = new Image();
          img.onload = () => {
            const maxEdge = 512;
            let { width, height } = img;
            if (width > maxEdge || height > maxEdge) {
              const scale = maxEdge / Math.max(width, height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
              reject(new Error('Could not process image'));
              return;
            }
            ctx.drawImage(img, 0, 0, width, height);
            const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const quality = mime === 'image/jpeg' ? 0.88 : undefined;
            const out = canvas.toDataURL(mime, quality);
            resolve({ dataUrl: out, mimeType: mime });
          };
          img.onerror = () => reject(new Error('Could not load that image'));
          img.src = dataUrl;
        } catch (err) {
          reject(err);
        }
      });
    }

    function wireAvatarSettings(user) {
      const host = document.getElementById('profileAvatarPickerHost');
      const status = document.getElementById('avatarSettingsStatus');
      const uploadBtn = document.getElementById('avatarUploadBtn');
      const uploadInput = document.getElementById('avatarUploadInput');
      const filenameEl = document.getElementById('avatarUploadFilename');
      if (!host || !window.AuthUI || !AuthUI.buildAvatarPickerHtml) return;

      const token = AuthUI.getAuthToken && AuthUI.getAuthToken();
      if (!token) {
        if (status) status.textContent = 'Log in to change your avatar.';
        return;
      }

      const currentId = AuthUI.avatarIdForUser(user) || '';
      host.innerHTML = AuthUI.buildAvatarPickerHtml(currentId, {
        gridId: 'profileAvatarPickerGrid',
        hiddenId: 'profileAvatarId',
      });
      const grid = document.getElementById('profileAvatarPickerGrid');
      const hidden = document.getElementById('profileAvatarId');
      let saving = false;

      AuthUI.wireAvatarPicker(grid, hidden, async function (avatarId) {
        if (saving) return;
        saving = true;
        if (status) status.textContent = 'Saving…';
        try {
          const resp = await fetch('/api/auth/profile', {
            method: 'PATCH',
            headers: { ...authHeaders(), accept: 'application/json' },
            body: JSON.stringify({ avatarId }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.error || data.message || `Failed (${resp.status})`);
          syncLocalUserAvatar(data.user || { avatarUrl: AuthUI.avatarPngPath(avatarId), avatarId });
          applyAvatarToHero(data.user);
          if (filenameEl) filenameEl.textContent = '';
          if (status) status.textContent = 'Avatar updated.';
        } catch (err) {
          if (status) status.textContent = err.message || 'Could not save avatar.';
        } finally {
          saving = false;
        }
      });

      if (uploadBtn && uploadInput) {
        uploadBtn.addEventListener('click', () => uploadInput.click());
        uploadInput.addEventListener('change', async () => {
          const file = uploadInput.files && uploadInput.files[0];
          uploadInput.value = '';
          if (!file) return;
          if (saving) return;

          const allowed = ['image/jpeg', 'image/png', 'image/webp'];
          if (!allowed.includes(file.type)) {
            if (status) status.textContent = 'Use a JPEG, PNG, or WebP image.';
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            if (status) status.textContent = 'Image is too large (try under 5 MB).';
            return;
          }

          saving = true;
          if (filenameEl) filenameEl.textContent = file.name;
          if (status) status.textContent = 'Uploading…';
          try {
            const prepared = await resizeImageForAvatar(file);
            const resp = await fetch('/api/auth/avatar', {
              method: 'POST',
              headers: { ...authHeaders(), accept: 'application/json' },
              body: JSON.stringify({
                imageBase64: prepared.dataUrl,
                mimeType: prepared.mimeType,
              }),
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.message || data.error || `Failed (${resp.status})`);
            syncLocalUserAvatar(data.user || { avatarUrl: data.avatarUrl });
            applyAvatarToHero(data.user || { avatarUrl: data.avatarUrl });
            if (grid) {
              grid.querySelectorAll('.avatar-pick-option').forEach((btn) => {
                btn.classList.remove('is-selected');
                btn.setAttribute('aria-checked', 'false');
              });
            }
            if (hidden) hidden.value = '';
            if (status) status.textContent = 'Custom avatar uploaded.';
          } catch (err) {
            if (status) status.textContent = err.message || 'Could not upload avatar.';
          } finally {
            saving = false;
          }
        });
      }
    }

    async function wireReminderSettings() {
      const toggle = document.getElementById('emailRemindersToggle');
      const status = document.getElementById('reminderSettingsStatus');
      if (!toggle) return;

      const token = window.AuthUI && AuthUI.getAuthToken && AuthUI.getAuthToken();
      if (!token) {
        if (status) status.textContent = 'Log in to manage email reminders.';
        toggle.disabled = true;
        return;
      }

      try {
        const resp = await fetch('/api/auth/settings', {
          headers: { ...authHeaders(), accept: 'application/json' },
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || data.message || `Failed (${resp.status})`);
        toggle.checked = !!(data.settings && data.settings.emailNotifications);
      } catch (err) {
        if (status) status.textContent = 'Could not load reminder settings.';
        toggle.disabled = true;
        return;
      }

      toggle.addEventListener('change', async function () {
        if (status) status.textContent = 'Saving…';
        toggle.disabled = true;
        try {
          const resp = await fetch('/api/auth/settings', {
            method: 'PATCH',
            headers: { ...authHeaders(), accept: 'application/json' },
            body: JSON.stringify({ emailNotifications: toggle.checked }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.error || data.message || `Failed (${resp.status})`);
          if (status) {
            status.textContent = toggle.checked
              ? 'Pick reminders enabled.'
              : 'Pick reminders turned off.';
          }
        } catch (err) {
          toggle.checked = !toggle.checked;
          if (status) status.textContent = err.message || 'Could not save settings.';
        } finally {
          toggle.disabled = false;
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
  <script>
    function closeMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      menu.classList.remove('show');
      button.classList.remove('active');
      button.setAttribute('aria-expanded', 'false');
      overlay.classList.remove('show');
      document.body.classList.remove('menu-open');
    }
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      const isOpening = !menu.classList.contains('show');
      menu.classList.toggle('show');
      button.classList.toggle('active');
      button.setAttribute('aria-expanded', isOpening ? 'true' : 'false');
      overlay.classList.toggle('show', isOpening);
      document.body.classList.toggle('menu-open', isOpening);
    }
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      if (!menu || !button) return;
      if (!menu.contains(event.target) && !button.contains(event.target)) closeMenu();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeMenu();
    });
  </script>
