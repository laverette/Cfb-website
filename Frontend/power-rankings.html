<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFB Power Rankings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/site-theme.css">
  <link rel="stylesheet" href="Resources/Styles/power.css">
</head>
<body>
  <nav class="navbar weeklypicks-navbar site-nav">
    <div class="container-fluid">
      <div class="navbar-content-weekly site-nav-inner">
        <button class="hamburger-menu-btn" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="dropdownMenu">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
        <h1 class="site-title">Power Rankings</h1>
        <div id="auth-nav" class="navbar-auth-cluster"></div>
      </div>
    </div>
  </nav>
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <main class="container page-shell power-page">
    <h1 class="page-title">CFB Power Rankings</h1>
    <p class="power-subtitle">
      Raw power = expected point edge vs an average FBS team on a neutral field.
      Power Score (0–100) is display-only — spreads use raw power.
    </p>

    <div class="power-toolbar">
      <label>
        Season
        <input id="seasonInput" class="form-control" type="number" min="2015" max="2035" style="width:7rem;">
      </label>
      <label>
        Through week
        <input id="weekInput" class="form-control" type="number" min="0" max="20" style="width:6rem;">
      </label>
      <button type="button" class="btn btn-gold" id="reloadBtn">Load rankings</button>
      <a class="btn btn-brown" href="predictor.html">Matchup Predictor</a>
    </div>
    <p class="power-meta" id="metaLine">Loading…</p>

    <section class="section-card">
      <div id="boardBody" class="power-table-wrap">
        <p class="power-loading">Loading power rankings…</p>
      </div>
    </section>
  </main>

  <script src="scripts/auth-ui.js"></script>
  <script>
    let rows = [];
    let sortKey = 'ranking';
    let sortDir = 1;

    function escapeHtml(t) {
      return String(t ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function moveHtml(m) {
      if (m == null || Number.isNaN(Number(m))) return '<span class="power-move-same">—</span>';
      const n = Number(m);
      if (n > 0) return `<span class="power-move-up">▲ ${n}</span>`;
      if (n < 0) return `<span class="power-move-down">▼ ${Math.abs(n)}</span>`;
      return '<span class="power-move-same">—</span>';
    }

    function sortedRows() {
      const copy = [...rows];
      copy.sort((a, b) => {
        const av = a[sortKey];
        const bv = b[sortKey];
        if (typeof av === 'string' || typeof bv === 'string') {
          return sortDir * String(av || '').localeCompare(String(bv || ''));
        }
        return sortDir * ((Number(av) || 0) - (Number(bv) || 0));
      });
      return copy;
    }

    function render() {
      const body = document.getElementById('boardBody');
      if (!rows.length) {
        body.innerHTML = '<p class="power-empty">No rankings yet. An admin can run <code>POST /api/power/run</code>, or enable live CFBD with <code>?live=1</code>.</p>';
        return;
      }
      const data = sortedRows();
      body.innerHTML = `
        <table class="power-table">
          <thead>
            <tr>
              <th data-k="ranking">#</th>
              <th data-k="name">Team</th>
              <th data-k="wins">Record</th>
              <th data-k="powerScore">Power</th>
              <th data-k="rawPower">Raw</th>
              <th data-k="offenseRating">Off</th>
              <th data-k="defenseRating">Def</th>
              <th data-k="specialTeamsRating">ST</th>
              <th data-k="talentRating">Talent</th>
              <th data-k="sosRating">SOS</th>
              <th data-k="rankingMovement">Chg</th>
            </tr>
          </thead>
          <tbody>
            ${data.map((t) => `
              <tr>
                <td class="power-rank">${t.ranking}</td>
                <td>
                  <span class="power-team">
                    ${t.logoUrl ? `<img src="${escapeHtml(t.logoUrl)}" alt="">` : ''}
                    ${escapeHtml(t.name)}
                  </span>
                </td>
                <td>${escapeHtml(t.record || `${t.wins || 0}-${t.losses || 0}`)}</td>
                <td><span class="power-score-pill">${Number(t.powerScore).toFixed(1)}</span></td>
                <td class="power-raw">${Number(t.rawPower) >= 0 ? '+' : ''}${Number(t.rawPower).toFixed(1)}</td>
                <td>${Number(t.offenseRating).toFixed(1)}</td>
                <td>${Number(t.defenseRating).toFixed(1)}</td>
                <td>${Number(t.specialTeamsRating).toFixed(1)}</td>
                <td>${Number(t.talentRating).toFixed(0)}</td>
                <td>${Number(t.sosRating).toFixed(1)}</td>
                <td>${moveHtml(t.rankingMovement)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;

      body.querySelectorAll('th[data-k]').forEach((th) => {
        th.addEventListener('click', () => {
          const k = th.getAttribute('data-k');
          if (sortKey === k) sortDir *= -1;
          else {
            sortKey = k;
            sortDir = k === 'name' ? 1 : (k === 'ranking' ? 1 : -1);
          }
          render();
        });
      });
    }

    async function load() {
      const season = document.getElementById('seasonInput').value;
      const week = document.getElementById('weekInput').value;
      const params = new URLSearchParams();
      if (season) params.set('season', season);
      if (week !== '') params.set('week', week);
      document.getElementById('boardBody').innerHTML = '<p class="power-loading">Loading power rankings…</p>';
      document.getElementById('metaLine').textContent = 'Loading…';
      try {
        let resp = await fetch(`/api/power/rankings?${params}`, { headers: { accept: 'application/json' } });
        let data = await resp.json().catch(() => ({}));
        if (!resp.ok && resp.status === 503) {
          params.set('live', '1');
          resp = await fetch(`/api/power/rankings?${params}`, { headers: { accept: 'application/json' } });
          data = await resp.json().catch(() => ({}));
        }
        if (!resp.ok) throw new Error(data.details || data.error || 'Failed');
        rows = Array.isArray(data.teams) ? data.teams : [];
        document.getElementById('metaLine').textContent =
          `${data.source || 'rankings'} · Season ${data.season} · Through week ${data.week} · ${rows.length} teams` +
          (data.note ? ` · ${data.note}` : '');
        if (data.season != null) document.getElementById('seasonInput').value = data.season;
        if (data.week != null) document.getElementById('weekInput').value = data.week;
        sortKey = 'ranking';
        sortDir = 1;
        render();
      } catch (err) {
        document.getElementById('boardBody').innerHTML =
          `<p class="power-empty">${escapeHtml(err.message || 'Could not load rankings')}</p>`;
        document.getElementById('metaLine').textContent = 'Unavailable';
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', load);
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('seasonInput').value = new Date().getFullYear();
      load();
    });

    function closeMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      menu.classList.remove('show');
      button.classList.remove('active');
      button.setAttribute('aria-expanded', 'false');
      overlay.classList.remove('show');
      document.body.classList.remove('menu-open');
    }
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      const isOpening = !menu.classList.contains('show');
      menu.classList.toggle('show');
      button.classList.toggle('active');
      button.setAttribute('aria-expanded', isOpening ? 'true' : 'false');
      overlay.classList.toggle('show', isOpening);
      document.body.classList.toggle('menu-open', isOpening);
    }
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      if (!menu || !button) return;
      if (!menu.contains(event.target) && !button.contains(event.target)) closeMenu();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeMenu();
    });
  </script>
</body>
</html>
