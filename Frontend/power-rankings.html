<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFB Power Rankings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/site-theme.css">
  <link rel="stylesheet" href="Resources/Styles/power.css">
</head>
<body class="power-rankings-body">
  <nav class="navbar weeklypicks-navbar site-nav">
    <div class="container-fluid">
      <div class="navbar-content-weekly site-nav-inner">
        <button class="hamburger-menu-btn" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="dropdownMenu">
          <span></span><span></span><span></span>
        </button>
        <div class="dropdown-menu" id="dropdownMenu"></div>
        <h1 class="site-title">Power Rankings</h1>
        <div id="auth-nav" class="navbar-auth-cluster"></div>
      </div>
    </div>
  </nav>
  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

  <main class="container page-shell power-page">
    <header class="power-header">
      <p class="power-eyebrow">Model board</p>
      <h1 class="power-title">CFB Power Rankings</h1>
      <p class="power-subtitle">
        Raw power is the expected point edge vs an average FBS team on a neutral field.
        Power Score is display-only — spreads use raw.
      </p>
    </header>

    <div class="power-control-bar">
      <div class="power-filters">
        <label class="power-field">
          <span>Season</span>
          <input id="seasonInput" class="site-select power-input" type="number" min="2015" max="2035">
        </label>
        <label class="power-field">
          <span>Through week</span>
          <input id="weekInput" class="site-select power-input" type="number" min="0" max="20">
        </label>
        <a class="btn btn-brown" href="predictor.html">Matchup Predictor</a>
      </div>
      <label class="power-field power-search-field">
        <span>Find team</span>
        <input id="teamSearch" class="site-select power-input" type="search" placeholder="Ohio State…" autocomplete="off">
      </label>
    </div>
    <p class="power-meta" id="metaLine">Loading…</p>

    <div id="boardBody" class="power-board">
      <p class="power-loading">Loading power rankings…</p>
    </div>
  </main>

  <script src="scripts/auth-ui.js"></script>
  <script>
    let rows = [];
    let sortKey = 'ranking';
    let sortDir = 1;
    let searchQuery = '';
    let loadTimer = null;

    function escapeHtml(t) {
      return String(t ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function moveHtml(m) {
      if (m == null || Number.isNaN(Number(m))) return '<span class="power-move-same">—</span>';
      const n = Number(m);
      if (n > 0) return `<span class="power-move-up">▲${n}</span>`;
      if (n < 0) return `<span class="power-move-down">▼${Math.abs(n)}</span>`;
      return '<span class="power-move-same">—</span>';
    }

    function unitClass(n) {
      if (!Number.isFinite(n) || n === 0) return '';
      return n > 0 ? 'is-pos' : 'is-neg';
    }

    function filteredRows() {
      const q = searchQuery.trim().toLowerCase();
      let list = [...rows];
      if (q) {
        list = list.filter((t) => String(t.name || '').toLowerCase().includes(q));
      }
      list.sort((a, b) => {
        const av = a[sortKey];
        const bv = b[sortKey];
        if (typeof av === 'string' || typeof bv === 'string') {
          return sortDir * String(av || '').localeCompare(String(bv || ''));
        }
        return sortDir * ((Number(av) || 0) - (Number(bv) || 0));
      });
      return list;
    }

    function thClass(k) {
      if (sortKey !== k) return '';
      return sortDir > 0 ? 'is-sorted asc' : 'is-sorted desc';
    }

    function render() {
      const body = document.getElementById('boardBody');
      if (!rows.length) {
        body.innerHTML = '<p class="power-empty">No rankings yet. An admin can run ratings from the Admin panel, or retry with live CFBD.</p>';
        return;
      }
      const data = filteredRows();
      if (!data.length) {
        body.innerHTML = '<p class="power-empty">No teams match that search.</p>';
        return;
      }
      body.innerHTML = `
        <div class="power-table-wrap">
          <table class="power-table">
            <thead>
              <tr>
                <th class="${thClass('ranking')}" data-k="ranking">#</th>
                <th class="${thClass('name')}" data-k="name">Team</th>
                <th class="${thClass('wins')}" data-k="wins">Rec</th>
                <th class="${thClass('powerScore')}" data-k="powerScore">Power</th>
                <th class="${thClass('rawPower')}" data-k="rawPower">Raw</th>
                <th class="${thClass('offenseRating')}" data-k="offenseRating">Off</th>
                <th class="${thClass('defenseRating')}" data-k="defenseRating">Def</th>
                <th class="${thClass('specialTeamsRating')}" data-k="specialTeamsRating">ST</th>
                <th class="${thClass('talentRating')}" data-k="talentRating">Talent</th>
                <th class="${thClass('rankingMovement')}" data-k="rankingMovement">Chg</th>
              </tr>
            </thead>
            <tbody>
              ${data.map((t, i) => {
                const top = Number(t.ranking) <= 3 ? ` power-row-top-${t.ranking}` : '';
                return `
              <tr class="power-row${top}" style="animation-delay:${Math.min(i, 12) * 0.02}s">
                <td class="power-rank">${t.ranking}</td>
                <td>
                  <span class="power-team">
                    ${t.logoUrl ? `<img src="${escapeHtml(t.logoUrl)}" alt="" loading="lazy">` : ''}
                    <span class="power-team-name">${escapeHtml(t.name)}</span>
                  </span>
                </td>
                <td class="power-rec">${escapeHtml(t.record || `${t.wins || 0}-${t.losses || 0}`)}</td>
                <td><span class="power-score-pill">${Number(t.powerScore).toFixed(1)}</span></td>
                <td class="power-raw">${Number(t.rawPower) >= 0 ? '+' : ''}${Number(t.rawPower).toFixed(1)}</td>
                <td class="power-unit ${unitClass(Number(t.offenseRating))}">${Number(t.offenseRating).toFixed(1)}</td>
                <td class="power-unit ${unitClass(Number(t.defenseRating))}">${Number(t.defenseRating).toFixed(1)}</td>
                <td class="power-unit ${unitClass(Number(t.specialTeamsRating))}">${Number(t.specialTeamsRating).toFixed(1)}</td>
                <td class="power-talent">${Number(t.talentRating).toFixed(0)}</td>
                <td>${moveHtml(t.rankingMovement)}</td>
              </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>`;

      body.querySelectorAll('th[data-k]').forEach((th) => {
        th.addEventListener('click', () => {
          const k = th.getAttribute('data-k');
          if (sortKey === k) sortDir *= -1;
          else {
            sortKey = k;
            sortDir = k === 'name' || k === 'ranking' ? 1 : -1;
          }
          render();
        });
      });
    }

    async function load() {
      const season = document.getElementById('seasonInput').value;
      const week = document.getElementById('weekInput').value;
      const params = new URLSearchParams();
      if (season) params.set('season', season);
      if (week !== '') params.set('week', week);
      document.getElementById('boardBody').innerHTML = '<p class="power-loading">Loading power rankings…</p>';
      document.getElementById('metaLine').textContent = 'Loading…';
      try {
        let resp = await fetch(`/api/power/rankings?${params}`, { headers: { accept: 'application/json' } });
        let data = await resp.json().catch(() => ({}));
        if (!resp.ok && resp.status === 503) {
          params.set('live', '1');
          resp = await fetch(`/api/power/rankings?${params}`, { headers: { accept: 'application/json' } });
          data = await resp.json().catch(() => ({}));
        }
        if (!resp.ok) throw new Error(data.details || data.error || 'Failed');
        rows = Array.isArray(data.teams) ? data.teams : [];
        document.getElementById('metaLine').textContent =
          `${data.source || 'rankings'} · Season ${data.season} · Through week ${data.week} · ${rows.length} teams`;
        if (data.season != null) document.getElementById('seasonInput').value = data.season;
        if (data.week != null) document.getElementById('weekInput').value = data.week;
        sortKey = 'ranking';
        sortDir = 1;
        render();
      } catch (err) {
        document.getElementById('boardBody').innerHTML =
          `<p class="power-empty">${escapeHtml(err.message || 'Could not load rankings')}</p>`;
        document.getElementById('metaLine').textContent = 'Unavailable';
      }
    }

    function scheduleLoad(delay) {
      clearTimeout(loadTimer);
      loadTimer = setTimeout(load, delay || 450);
    }

    function bindFilterInputs() {
      const seasonInput = document.getElementById('seasonInput');
      const weekInput = document.getElementById('weekInput');
      seasonInput.addEventListener('change', load);
      weekInput.addEventListener('change', load);
      seasonInput.addEventListener('input', () => scheduleLoad(600));
      weekInput.addEventListener('input', () => scheduleLoad(400));
    }

    document.getElementById('teamSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value || '';
      render();
    });
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('seasonInput').value = new Date().getFullYear();
      bindFilterInputs();
      load();
    });

    function closeMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      menu.classList.remove('show');
      button.classList.remove('active');
      button.setAttribute('aria-expanded', 'false');
      overlay.classList.remove('show');
      document.body.classList.remove('menu-open');
    }
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      const overlay = document.getElementById('menuOverlay');
      if (!menu || !button || !overlay) return;
      const isOpening = !menu.classList.contains('show');
      menu.classList.toggle('show');
      button.classList.toggle('active');
      button.setAttribute('aria-expanded', isOpening ? 'true' : 'false');
      overlay.classList.toggle('show', isOpening);
      document.body.classList.toggle('menu-open', isOpening);
    }
    document.addEventListener('click', function(event) {
      const menu = document.getElementById('dropdownMenu');
      const button = document.querySelector('.hamburger-menu-btn');
      if (!menu || !button) return;
      if (!menu.contains(event.target) && !button.contains(event.target)) closeMenu();
    });
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeMenu();
    });
  </script>
</body>
</html>
