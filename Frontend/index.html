<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/site-theme.css">
    <link rel="stylesheet" href="Resources/Styles/index.css">
</head>
<body>
    <!-- Site Header -->
    <nav class="navbar weeklypicks-navbar site-nav">
      <div class="container-fluid">
        <div class="navbar-content-weekly site-nav-inner">
          <button class="hamburger-menu-btn" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="dropdownMenu">
            <span></span><span></span><span></span>
          </button>
          <div class="dropdown-menu" id="dropdownMenu"></div>

          <h1 class="site-title">
            <span class="site-title-full">My College Football Site</span>
            <span class="site-title-short">Logan A Poll</span>
          </h1>

          <div id="auth-nav" class="navbar-auth-cluster"></div>
        </div>
      </div>
    </nav>
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    <main class="page-shell">
        <section class="section-card home-explore">
            <div class="home-explore-copy">
                <div class="season-badge">🏈 2025 Season</div>
                <h2 class="gold-heading home-explore-title">Explore the Site</h2>
                <p class="home-explore-lede">
                    Jump into picks, teams, and model tools.
                </p>
                <div class="home-button-grid">
                    <a href="weeklypicks.html" class="btn btn-gold btn-lg rounded-pill">Weekly Picks</a>
                    <a href="teams.html" class="btn btn-brown btn-lg rounded-pill">Teams</a>
                    <a href="predictor.html" class="btn btn-brown btn-lg rounded-pill">Model</a>
                    <a href="prediction-history.html" class="btn btn-brown btn-lg rounded-pill">History</a>
                    <a href="mypredictions.html" class="btn btn-brown btn-lg rounded-pill">Bama Schedule</a>
                    <a href="bama.html" class="btn btn-brown btn-lg rounded-pill">Bama Predictions</a>
                    <a href="CFPPredictions.html" class="btn btn-brown btn-lg rounded-pill">CFP Picks</a>
                    <a href="list.html" class="btn btn-brown btn-lg rounded-pill">Heisman</a>
                </div>
            </div>
            <div class="home-explore-media">
                <img src="https://a.espncdn.com/photo/2014/0714/ncf_trophy1_ms_1296x729.jpg" alt="College Football Playoff trophy">
            </div>
        </section>
    </main>
    <script src="scripts/auth-ui.js"></script>
    <script>
      function closeMenu() {
        const menu = document.getElementById('dropdownMenu');
        const button = document.querySelector('.hamburger-menu-btn');
        const overlay = document.getElementById('menuOverlay');
        if (!menu || !button || !overlay) return;
        menu.classList.remove('show');
        button.classList.remove('active');
        button.setAttribute('aria-expanded', 'false');
        overlay.classList.remove('show');
        document.body.classList.remove('menu-open');
      }

      function toggleMenu() {
        const menu = document.getElementById('dropdownMenu');
        const button = document.querySelector('.hamburger-menu-btn');
        const overlay = document.getElementById('menuOverlay');
        if (!menu || !button || !overlay) return;
        const isOpening = !menu.classList.contains('show');
        menu.classList.toggle('show');
        button.classList.toggle('active');
        button.setAttribute('aria-expanded', isOpening ? 'true' : 'false');
        overlay.classList.toggle('show', isOpening);
        document.body.classList.toggle('menu-open', isOpening);
      }

      document.addEventListener('click', function(event) {
        const menu = document.getElementById('dropdownMenu');
        const button = document.querySelector('.hamburger-menu-btn');
        if (!menu || !button) return;
        if (!menu.contains(event.target) && !button.contains(event.target)) closeMenu();
      });

      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') closeMenu();
      });
    </script>
</body>
</html>
